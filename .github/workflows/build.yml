name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: bash tools/bootstrap.sh
      - name: Analyze and test
        working-directory: app
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - name: Smoke launch
        run: |
          set +e
          timeout 10s xvfb-run -a app/build/linux/x64/release/bundle/mimic_mixamo > /tmp/mimic-launch.log 2>&1
          status=$?
          cat /tmp/mimic-launch.log
          if [ "$status" -ne 124 ]; then exit 1; fi
      - name: Package complete bundle
        run: |
          mkdir -p dist
          cp README.md dist/README.md
          printf 'commit=%s\nflutter=3.35.7\nplatform=linux-x86_64\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
          tar -czf dist/mimic-linux-x86_64.tar.gz -C app/build/linux/x64/release/bundle .
          cd dist
          sha256sum mimic-linux-x86_64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: bash tools/bootstrap.sh
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-debug.apk dist/mimic-debug.apk
          printf 'commit=%s\nflutter=3.35.7\nkind=debug\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
          cd dist
          sha256sum mimic-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-android-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
