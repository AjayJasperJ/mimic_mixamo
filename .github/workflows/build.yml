name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb curl file desktop-file-utils squashfs-tools patchelf libportaudio2 libgl1 libegl1 assimp-utils libassimp5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Check development asset contract
        run: python3 -m unittest discover -s tools/python -p 'test_*.py' -v
      - run: bash tools/bootstrap.sh
      - name: Analyze and test
        working-directory: app
        run: |
          dart format lib test
          flutter analyze
          flutter test
      - name: Build Linux
        working-directory: app
        run: flutter build linux --release
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/linux/requirements.txt
      - name: Install pinned tracker build dependencies
        run: python3 -m pip install -r tools/linux/requirements.txt
      - name: Fetch checksum pinned hand tracking model
        run: python3 tools/python/fetch_hand_model.py
      - name: Build single-file AppImage and bundled tracker
        run: bash tools/linux/build_appimage.sh
      - name: Test packaged tracker without a webcam
        run: |
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Mimic-x86_64.AppImage --tracker-self-test > /tmp/mimic-tracker-self-test.json
          cat /tmp/mimic-tracker-self-test.json
          python3 -c 'import json; r=json.load(open("/tmp/mimic-tracker-self-test.json")); assert r["ok"] and r["kind"] == "self-test"'
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Mimic-x86_64.AppImage --tracker-list-devices
      - name: Test bundled FBX-to-GLB exporter
        run: |
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH PATH=/usr/bin:/bin APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Mimic-x86_64.AppImage --assimp-self-test > /tmp/mimic-assimp-self-test.json
          cat /tmp/mimic-assimp-self-test.json
          python3 -c 'import json; r=json.load(open("/tmp/mimic-assimp-self-test.json")); assert r["ok"] and r["exporter"] == "glb2"'
      - name: Smoke launch AppImage
        run: |
          set +e
          timeout 30s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Mimic-x86_64.AppImage > /tmp/mimic-launch.log 2>&1
          status=$?
          cat /tmp/mimic-launch.log
          if [ "$status" -ne 124 ]; then exit 1; fi
          grep -q MIMIC_LAUNCH_READY /tmp/mimic-launch.log
      - name: Smoke test calibration and full-body replay in AppImage
        run: |
          set +e
          timeout 25s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Mimic-x86_64.AppImage --smoke-replay > /tmp/mimic-replay.log 2>&1
          status=$?
          cat /tmp/mimic-replay.log
          if [ "$status" -ne 124 ]; then exit 1; fi
          grep -q 'MIMIC_REPLAY_READY source=synthetic bones=42 mesh=true' /tmp/mimic-replay.log
      - name: Record build and checksum
        run: |
          cp README.md dist/README.md
          printf 'commit=%s\nflutter=3.35.7\nplatform=linux-x86_64-appimage\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
          cd dist
          sha256sum Mimic-x86_64.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-linux-x86_64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  android:
    # Paused by owner: keep implementation, allocate no Android runner.
    if: ${{ false }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/packages/mimic_native/android/build.gradle
            app/pubspec.lock
            app/android/app/build.gradle.kts
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Check development asset contract
        run: python3 -m unittest discover -s tools/python -p 'test_*.py' -v
      - run: bash tools/bootstrap.sh
      - name: Bundle versioned offline pose model
        run: python3 tools/python/fetch_pose_model.py
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Native GLB container tests
        working-directory: app/android
        run: bash ./gradlew :mimic_native:testDebugUnitTest
      - name: Verify packaged camera and GLB assets
        run: python3 tools/python/verify_apk.py app/build/app/outputs/flutter-apk/app-debug.apk
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-debug.apk dist/mimic-debug.apk
          printf 'commit=%s\nflutter=3.35.7\nkind=debug\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt
          cd dist
          sha256sum mimic-debug.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mimic-android-debug-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish latest test release
    needs: [linux]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mimic-linux-x86_64-${{ github.sha }}
          path: downloads/linux
      - name: Verify and prepare release assets
        run: |
          (cd downloads/linux && sha256sum -c SHA256SUMS)
          mkdir release-assets
          cp downloads/linux/Mimic-x86_64.AppImage release-assets/
          cp downloads/linux/BUILD_INFO.txt release-assets/LINUX_BUILD_INFO.txt
          cp downloads/linux/README.md release-assets/README.md
          cd release-assets
          sha256sum Mimic-x86_64.AppImage > SHA256SUMS
      - name: Publish before removing previous test releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # An old workflow rerun must not replace a newer main build.
          head_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "Main has advanced; skipping stale release."
            exit 0
          fi
          tag="test-build-$GITHUB_RUN_NUMBER"
          cat > notes.md <<EOF
          <!-- mimic-managed-test-release -->
          Automated test build from commit $GITHUB_SHA.
          Linux-only AppImage: T-pose calibration, live upper-body retargeting, smoothing/loss recovery and experimental full-body grounding. Android runner remains paused. Real-device accuracy and performance acceptance remain pending.
          Linux: chmod +x Mimic-x86_64.AppImage, then run ./Mimic-x86_64.AppImage. No Python installation or sidecar files required.
          Only the newest successful automatic test release is retained.
          EOF
          # Resume an interrupted draft safely; leave a published release immutable.
          if gh release view "$tag" --json isDraft > existing.json 2>/dev/null; then
            if [ "$(jq -r .isDraft existing.json)" = true ]; then
              gh release upload "$tag" release-assets/* --clobber
              gh release edit "$tag" --draft=false --prerelease --notes-file notes.md
            fi
          else
            gh release create "$tag" release-assets/* --target "$GITHUB_SHA" \
              --title "Mimic test build $GITHUB_RUN_NUMBER" --notes-file notes.md --prerelease
          fi
          # Confirm publication and essential assets before any deletion.
          gh release view "$tag" --json isDraft,assets > published.json
          jq -e '.isDraft == false and ([.assets[].name] | index("Mimic-x86_64.AppImage") != null and index("SHA256SUMS") != null)' published.json
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true) | select((.body // "") | contains("<!-- mimic-managed-test-release -->")) | .tag_name' > candidates.txt
          while IFS= read -r old_tag; do
            if [[ "$old_tag" =~ ^test-build-([0-9]+)$ ]]; then
              old_run="${BASH_REMATCH[1]}"
              if (( old_run < GITHUB_RUN_NUMBER )); then
                gh release delete "$old_tag" --yes --cleanup-tag
              fi
            fi
          done < candidates.txt
