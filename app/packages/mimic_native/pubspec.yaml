publish_to: none
environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.ajayjasper.mimic.nativeview
        pluginClass: MimicNativePlugin
