group = 'com.ajayjasper.mimic.nativeview'
version = '0.1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'com.ajayjasper.mimic.nativeview'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation 'com.google.android.filament:filament-android:1.56.0'
    implementation 'com.google.android.filament:gltfio-android:1.56.0'
    implementation 'com.google.android.filament:filament-utils-android:1.56.0'
}
