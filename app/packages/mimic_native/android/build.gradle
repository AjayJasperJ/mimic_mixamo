group = 'com.ajayjasper.mimic.nativeview'
version = '0.1.0'
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
android {
    namespace 'com.ajayjasper.mimic.nativeview'
    compileSdk 35
    defaultConfig { minSdk 24 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.filament:filament-android:1.56.0'
    implementation 'com.google.android.filament:gltfio-android:1.56.0'
    implementation 'com.google.android.filament:filament-utils-android:1.56.0'
}

// Fail builds instead of publishing an APK with a missing tracking model.
tasks.register('verifyPoseModel') {
    doLast {
        if (!file('src/main/assets/pose_landmarker_lite.task').isFile()) {
            throw new GradleException('Missing pose model. Run python3 tools/python/fetch_pose_model.py from repository root.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPoseModel' }
